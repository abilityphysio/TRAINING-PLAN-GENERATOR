function rw(s){var D=s.unit==='km'?s.len:s.oth,T=s.unit==='min'?s.len:s.oth,wr=prng(s.wp,s.wc)||{lo:10,hi:10},rr=prng(s.pace,s.pc),wm=(wr.lo+wr.hi)/2,dm=s.seg==='Distance',N,cd,ct,rd,wd,rt,wt,o={wr:wr,rr:rr};

function rwT(s,o,half){var dm=s.seg==='Distance',rp=o.rr?fR(o.rr):mm(o.rp+(half===1?5/60:half===2?-5/60:0));

function netT(s,r){var same=Math.abs(r.lo-r.hi)<1e-9,u=s.unit;
 if(u==='km'||u==='m'){var L=u==='m'?s.len/1000:s.len;return s.len+' '+u+' in '+(same?hms(L*r.lo):hms(L*r.lo)+'-'+hms(L*r.hi))}

function rngD(a,b){return Math.abs(a-b)<1e-9?km(a):km(a)+'-'+km(b)}
function rwA(s){var wr=prng(s.wp,s.wc)||{lo:10,hi:10},rr=prng(s.pace,s.pc),N=Math.max(1,s.reps==null?6:+s.reps||1),dm=s.seg==='Distance',o={wr:wr,rr:rr,N:N},rd,wd,rt,wt;
 if(dm){rd=s.run/1000;wd=s.walk/1000;o.D=N*(rd+wd);if(rr){o.tl=N*(rd*rr.lo+wd*wr.lo);o.th=N*(rd*rr.hi+wd*wr.hi)}}
 else{rt=s.run;wt=s.walk/60;o.T=N*(rt+wt);if(rr){o.dh=N*(rt/rr.lo+wt/wr.lo);o.dl=N*(rt/rr.hi+wt/wr.hi)}}

function pr(p,c,s){if(!p||p==='none'||p==='self')return null;if(p==='auto')return(s&&s===S.race&&s.autoRp)?{lo:s.autoRp,hi:s.autoRp}:null;if(p==='custom')return parseP(c);var a=String(p).split('-');return{lo:+a[0],hi:+a[1]}}

 if(t==='RUN-WALK'){var dm=b.seg==='Distance';n=Math.max(1,Math.round(+b.reps||1));segs=[[b.run,dm?'m':'min',pr(b.pace,b.pc,s)],[b.walk,dm?'m':'sec',pr(b.wp,b.wc,s)]];
  line='(Run '+b.run+(dm?' metres':' min')+pT(b.pace,b.pc,s)+' / Walk '+b.walk+(dm?' metres':' sec')+pT(b.wp,b.wc,s)+') x '+n}
 else if(t==='INTERVAL RUN'||t==='TEMPO RUN'){n=Math.max(1,Math.round(+b.reps||1));segs=[[b.len,b.unit,pr(b.pace,b.pc,s)]];if(n>1)segs.push([b.rV,b.rU,pr(b.rp,b.rpc,s)||{lo:b.rT==='Walk'?11:8,hi:b.rT==='Walk'?11:8}]);
  line=(n>1?n+' x ':(t==='TEMPO RUN'?'Tempo ':''))+b.len+' '+uL(b.unit)+pT(b.pace,b.pc,s)+(n>1?', rec '+b.rV+' '+uL(b.rU)+' '+String(b.rT).toLowerCase()+pT(b.rp,b.rpc,s):'')}
 else{n=1;segs=[[b.len,b.unit,pr(b.pace,b.pc,s)]];line=b.len+' '+uL(b.unit)+pT(b.pace,b.pc,s)}

 segs.forEach(function(g){var o=segTD(+g[0]||0,g[1],g[2]);if(o.Dl==null)T.d=0;else{T.Dl+=n*o.Dl;T.Dh+=n*o.Dh}if(o.Tl==null)T.t=0;else{T.Tl+=n*o.Tl;T.Th+=n*o.Th}});

function strInfo(s,b){var q=String(b.len).split('|'),v=+q[0],u=q[1],r=pr(b.pace,b.pc,s),n=Math.max(1,Math.round(+b.reps||1)),w=segTD(v,u,r),T={Dl:0,Dh:0,Tl:0,Th:0,d:1,t:1},rd=null,rt=null,pc=b.rT==='Jog'?8:11;
 if(b.rec==='eq'||b.rec==='dbl'){if(w.Dl!=null){rd=(w.Dl+w.Dh)/2*(b.rec==='dbl'?2:1);rt=rd*pc}}else{rt=(+String(b.rec).split('|')[0])/60;rd=rt/pc}
 if(w.Dl==null)T.d=0;else{T.Dl+=n*w.Dl;T.Dh+=n*w.Dh}if(w.Tl==null)T.t=0;else{T.Tl+=n*w.Tl;T.Th+=n*w.Th}
 if(rd==null){T.d=0;T.t=0}else{if(T.d){T.Dl+=n*rd;T.Dh+=n*rd}if(T.t){T.Tl+=n*rt;T.Th+=n*rt}}
 return{line:'Strides: '+n+' x '+v+' '+uL(u)+pT(b.pace,b.pc,s)+', rec '+(b.rec==='eq'?'equal distance':b.rec==='dbl'?'double distance':String(b.rec).split('|')[0]+' sec')+' '+String(b.rT).toLowerCase(),T:T}}
function totals(s,wc){var T={Dl:0,Dh:0,Tl:0,Th:0,d:1,t:1};
